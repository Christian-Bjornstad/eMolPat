[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emolpat"
version = "0.1.2"
description = "Unified local portal for approved molecular pathology applications"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "packaging>=25,<26",
    "PyQt6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "pytest>=8.4,<10",
    "pytest-qt>=4.5,<5",
    "ruff>=0.12,<1",
]

[project.scripts]
emolpat = "emolpat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"emolpat.ui.resources" = ["*.json", "*.png", "*.svg", "*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyqt6"

[tool.ruff]
target-version = "py312"
line-length = 88
